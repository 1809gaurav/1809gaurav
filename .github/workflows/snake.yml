name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: 1809gaurav
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238E2DE2&color_dots=%230D0221,%232D1B4E,%234A2C87,%236A11CB,%238E2DE2
            dist/github-contribution-grid-snake-dark.svg?color_snake=%238E2DE2&color_dots=%230D0221,%232D1B4E,%234A2C87,%236A11CB,%238E2DE2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
